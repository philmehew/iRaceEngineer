# iRaceEngineer Configuration

# iRacing connection
iracing:
  tick_rate_hz: 30           # How fast to poll shared memory

# LLM API (OpenAI-compatible — works with Ollama Cloud, OpenAI, LM Studio, etc.)
llm:
  base_url: "https://ollama.com/v1"         # Ollama Cloud endpoint
  api_key_env: "2d037788fae94179ba526b56ec4f1dea.J6EUKATFFsHZMzykGG_cVfog"            # Reads from environment variable
  model: "ministral-3:14b-cloud"
  max_tokens: 300
  temperature: 0.3

# Action execution (v1: dry_run only — actions are logged but not sent to iRacing)
actions:
  enabled: false             # Set to true to actually execute [ACTION] directives
  allowed_actions:           # Whitelist of actions that can be executed when enabled
    - pit_this_lap
    - add_fuel
    - change_tyres
    - clear_penalty

# Team identification — how to recognise your teammates
# AUTO-DETECT (default): iRacing assigns each driver a TeamName in session info.
# If you and your teammates all set the same TeamName in iRacing, they're found
# automatically — no config needed here at all.
#
# FALLBACK: If TeamName isn't set or you want to be explicit, list usernames
# or car numbers below. These are matched in addition to auto-detection.
#
# Teammates can be specified as:
#   - Plain string: matches iRacing UserName exactly, displayed as-is
#     e.g. "Wayne Smith8"
#   - Mapping (nickname: real_name): iRacing UserName is the key, real name is the value.
#     Used when the iRacing display name differs from the driver's real name.
#     e.g. Evolution: Patrik Farsang
#     Both names are shown in context: "Evolution / Patrik Farsang"
team:
  auto_detect: true              # Match drivers with the same TeamName as the player
  teammates:
    - Evolution: Patrik Farsang
    - Wayne Smith8
    - Andre Groove
    - Dan Golden
    - Dave Cartnerdobbs
    - Liam Biggs
    - David Barlow
    - Mayhem: Phil Mehew
  car_numbers: []                # Alternative: identify by car number

# Button trigger
trigger:
  method: "keyboard"         # "keyboard" for now; "wheel_button" later via pygame
  key: "f9"                  # Keyboard key to trigger LLM call

# Prompt configuration
prompt:
  system: |
    You are a race engineer. Speak in short radio-style sentences. No markdown, bullets, or headers.
    Example: 'Box this lap. Tyres are gone. Add 60 litres.'
    If unsure, say so. Never invent data. The 'Your car' section is the driver you're talking to.

    Rules:
    - Only respond when asked. Don't promise to monitor or call pit later.
    - Don't suggest setup changes (pressures, brake bias) without known reference ranges.
    - Don't assess temps or pressures as high/low without knowing the car's normal range — just report values.
    - Don't name track corners unless that data is in the context.
    - 'Incidents' are safety points (0x per off-track), NOT car damage.
    - If tyre data is marked unreliable, don't comment on degradation, trends, or whether values are changing.
    - [ACTION] add_fuel amounts: whole litres, min 1L, max = tank capacity - current fuel.

    Optional actions: [ACTION] pit_this_lap | add_fuel: <litres> | change_tyres | clear_penalty
  context_depth: "full"       # "minimal", "medium", or "full"
  # minimal: position, fuel, laps remaining only
  # medium: + gaps, tyre temps, flags
  # full:   + lap time trends, nearby cars, pit window estimate, weather, damage
  include_lap_history: 5     # How many recent laps to include (full depth only)
  include_nearby_cars: 3     # How many nearby cars to report (full depth only)

# State tracking
state:
  track_lap_times: true       # Store per-lap data for trend analysis
  track_fuel: true             # Track fuel consumption per lap
  track_tyre_temps: true       # Track tyre temperature trends

# Capture/replay test mode
capture:
  interval_ms: 1000           # How often to save snapshots in capture mode
  output_dir: "./tests/sample_data"  # Where to save captured data

# Logging
logging:
  llm_query_log_dir: "logs"              # Directory for LLM query log files
  llm_query_log_file: "llm_queries.log" # Log filename
  llm_query_max_bytes: 1000000          # Rotate at 1 MB
  llm_query_backup_count: 5             # Keep 5 rotated files
